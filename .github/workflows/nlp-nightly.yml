name: Nightly NLP Check

# Validates the Groq NLP parser against the real model -- but only on nights
# when the NLP surface actually changed. See scripts/nlp_nightly_gate.py for
# the gate (DST-twin selection + watched-path diff) and docs/testing.md for the
# operator view.
#
# Why conditional rather than every night: the external_api suite shares a
# per-org Groq TPM bucket with the deployed containers, and issue #118 traced a
# staging outage to exactly that contention. Running only when
# services/parser.py & co. move keeps the spend and the 429 risk proportional
# to the risk being covered.
#
# Why 03:00 ET: station traffic and staging load are at their floor, so the
# suite gets the TPM bucket to itself. GitHub cron is UTC-only, so the two
# entries below are the same 03:00 ET in each DST regime and the gate discards
# whichever one is not tonight's.
#
# Scope: TestParserIntegration only. It calls parse_request() directly with a
# real Groq client, so it exercises the prompt and the model without POSTing to
# /request -- which would post test results into Slack from the deployed
# container. The rest of the external_api suite stays manual, in
# external-api.yml.

on:
  schedule:
    - cron: "0 7 * * *" # 03:00 America/New_York while EDT (UTC-4)
    - cron: "0 8 * * *" # 03:00 America/New_York while EST (UTC-5)
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the gate reads this workflow's own artifacts for a baseline

concurrency:
  group: nlp-nightly
  cancel-in-progress: false

env:
  # Named once so the writer (the suite job) and the reader (the gate) cannot
  # drift apart. The artifact's own metadata carries the commit; its contents
  # are for whoever downloads it wondering what it is.
  GREEN_MARKER: nlp-green-sha

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The gate diffs HEAD against the last validated SHA, which can be
          # many commits back; the default shallow clone would not contain it.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The baseline is the commit of the last run that *actually passed the
      # suite*, read from the marker artifact the suite job uploads.
      #
      # It deliberately is NOT "the last successful workflow run". Both cron
      # entries fire every night and the one that is not tonight's exits green
      # after doing nothing, so a run-conclusion baseline would be advanced to
      # HEAD by a run that validated nothing. Under EST the decoy fires an hour
      # *before* the real entry, so the real run would then diff HEAD against
      # HEAD and skip -- the suite would never run from November to March, and
      # every job would be green while it happened. The same mechanism would
      # unstick a red night: the decoy would move the baseline past the failure
      # and the suite would go quiet after reporting the regression once.
      #
      # Only a passing suite writes the marker, so: a red night leaves the
      # baseline where it was and re-runs until green, and a gated-off night
      # writes nothing, which keeps the diff anchored to the last commit whose
      # parser behaviour was actually observed.
      - name: Find the last validated commit
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          MARKER: ${{ env.GREEN_MARKER }}
        run: |
          set -euo pipefail
          # `|| true`: a 5xx or a throttled API must not fail the gate. An
          # unresolved baseline degrades to "run the suite" (see the gate's
          # fail-open rule), which is the right side to err on -- the wrong side
          # is a red job at 03:00 that pages someone about GitHub's API rather
          # than about the parser. An empty artifact list lands here too: jq
          # indexes null happily, so `// ""` covers the no-run-yet case, as it
          # does the case where the marker has aged out of retention.
          base="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${MARKER}&per_page=100" \
            --jq '[.artifacts[]
                   | select(.expired == false and .workflow_run.head_branch == env.BRANCH)]
                  | sort_by(.created_at) | last | .workflow_run.head_sha // ""' || true)"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "Baseline: ${base:-<none: no validated run on this branch yet, or the marker expired>}"

      - name: Decide whether to run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          BASE_SHA: ${{ steps.baseline.outputs.base }}
        run: |
          set -euo pipefail
          python scripts/nlp_nightly_gate.py \
            --event-name "$EVENT_NAME" \
            --event-schedule "$EVENT_SCHEDULE" \
            --base "$BASE_SHA" \
            --head "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  nlp:
    name: Groq Parser Suite
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # 21 tests, but well over 21 Groq round-trips (one case parses the same
    # message ten times to check reliability): ~7 minutes measured end-to-end,
    # and a throttled bucket stretches that. Generous enough not to fail on a
    # slow night, tight enough that a hung client cannot burn an hour.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Without a key every test in the class is skipif'd away and the job goes
      # green having validated nothing -- the same silent-pass failure mode the
      # marker-sync check guards against. Fail loudly instead.
      - name: Require a Groq key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "::error::GROQ_API_KEY is unset; the parser suite would skip itself into a false green."
            exit 1
          fi

      # TEST_ENV=staging makes the autouse local_server fixture a no-op. These
      # tests never touch that server -- they call parse_request() in-process --
      # but the fixture would otherwise try to boot uvicorn on the runner.
      - name: Run the Groq parser suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TEST_ENV: staging
        run: pytest tests/integration/test_integration.py::TestParserIntegration -v -m external_api

      # Reached only when the suite passed -- no `if:`, so a failing step above
      # stops the job here and the marker is not written. That absence is what
      # keeps the next night's baseline anchored to the last commit whose parser
      # behaviour was actually observed against the live model.
      - name: Record this commit as validated
        run: |
          {
            echo "$GITHUB_SHA"
            echo "# Marker for .github/workflows/nlp-nightly.yml. Its existence"
            echo "# means TestParserIntegration passed against live Groq at this"
            echo "# commit; the gate reads the SHA from the artifact's metadata."
          } > "$RUNNER_TEMP/$GREEN_MARKER.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.GREEN_MARKER }}
          path: ${{ runner.temp }}/${{ env.GREEN_MARKER }}.txt
          if-no-files-found: error
          # Long enough that a quiet stretch of parser work does not expire the
          # baseline and force a needless run; short enough to stay tidy. An
          # expired marker degrades to "no baseline", i.e. one re-validating run.
          retention-days: 90

  notify-failure:
    # Nobody is watching Actions at 03:00, so a red nightly has to come find
    # someone. Mirrors the notify-failure job in ci.yml.
    name: Notify on failure
    needs: [gate, nlp]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Post failure to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MONITORING_WEBHOOK }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_URL: "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          COMMIT_SHA: ${{ github.sha }}
          REASON: ${{ needs.gate.outputs.reason }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_MONITORING_WEBHOOK unset; skipping Slack post."
            exit 0
          fi
          SHORT_SHA="${COMMIT_SHA:0:7}"
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\":x: *request-o-matic nightly NLP check failed*\nThe Groq parser suite is red against the live model.\nTrigger: ${REASON}\nCommit: <$COMMIT_URL|$SHORT_SHA>\nRun: $RUN_URL\"}" \
            || true
