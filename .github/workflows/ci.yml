name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Lint with ruff
        run: ruff check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Type check with mypy
        run: mypy . --ignore-missing-imports

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-httpx pytest-cov

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=. --cov-report=xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service request-o-matic
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      - name: Smoke test
        run: |
          curl -sf https://request-o-matic-staging.up.railway.app/health | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          services = data['services']
          errors = []
          if services['groq'] != 'ok':
              errors.append(f\"groq: {services['groq']}\")
          if services['database'] != 'ok':
              errors.append(f\"database: {services['database']}\")
          if services['discogs_api'] != 'ok':
              errors.append(f\"discogs_api: {services['discogs_api']}\")
          if errors:
              print('Smoke test FAILED:', ', '.join(errors))
              sys.exit(1)
          print('Smoke test passed:', json.dumps(services))
          "

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-staging]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-httpx

      - name: Run integration tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          TEST_ENV: staging
        run: pytest tests/integration/ -v -m integration

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service request-o-matic
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}

      - name: Smoke test
        run: |
          curl -sf https://request-o-matic-production.up.railway.app/health | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          services = data['services']
          errors = []
          if services['groq'] != 'ok':
              errors.append(f\"groq: {services['groq']}\")
          if services['database'] != 'ok':
              errors.append(f\"database: {services['database']}\")
          if services['discogs_api'] != 'ok':
              errors.append(f\"discogs_api: {services['discogs_api']}\")
          if errors:
              print('Smoke test FAILED:', ', '.join(errors))
              sys.exit(1)
          print('Smoke test passed:', json.dumps(services))
          "
