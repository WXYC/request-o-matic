name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]
  workflow_dispatch:

# Default GITHUB_TOKEN scope for every job in this workflow. None of these
# jobs push code, comment on PRs, or create releases; the deploy jobs use
# RAILWAY_TOKEN_* secrets, not GITHUB_TOKEN. contents:read is the safe floor.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Lint with ruff
        run: ruff check .

  codegen-check:
    # Fails fast when generated/api_models.py lags the wxyc-shared api.yaml
    # contract. Without this gate the committed models drifted silently across
    # many wxyc-shared releases (fixed in #175). PR-only: it regenerates and
    # diffs, which needs the codegen toolchain that normal jobs don't carry.
    # Mirrors library-metadata-lookup's codegen-check job.
    name: Codegen Freshness
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requirements-dev.txt pins datamodel-code-generator + ruff, so a new
        # release with different generated-code formatting cannot silently fail
        # this job on an unrelated PR (same rationale as the lint job's pins).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Regenerate API models
        # No sibling wxyc-shared checkout exists in CI, so the script downloads
        # api.yaml from wxyc-shared main and regenerates generated/api_models.py.
        run: bash scripts/generate_api_models.sh

      - name: Check for drift
        # A non-empty diff means the committed models are stale: regenerate with
        # `bash scripts/generate_api_models.sh` and commit the result.
        run: git diff --exit-code generated/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Type check with mypy
        run: mypy . --ignore-missing-imports

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=. --cov-report=xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  deps-sync:
    # Guards the dependency-pinning invariant (issue #168): uv.lock is the
    # single source of truth, and requirements.txt / requirements-dev.txt are
    # generated artifacts that must match it. `uv lock --locked` proves the
    # lock is consistent with pyproject.toml; re-exporting and diffing proves
    # the committed requirements files were regenerated from that lock. Without
    # this gate a floor-only spec could silently float CI/Railway across a
    # breaking release (the #164 / fastapi 0.137 incident). Policy + regenerate
    # procedure: docs/deployment.md > Dependency management. Keep the pinned uv
    # version below aligned with the one used to run the export commands there,
    # since the export format is uv-version-sensitive.
    name: Dependency Lock Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.11.21

      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --locked

      - name: Verify requirements files are regenerated from the lock
        run: |
          uv export --frozen --no-emit-project --no-hashes -o requirements.txt
          uv export --frozen --extra dev --no-emit-project --no-hashes -o requirements-dev.txt
          if [ -n "$(git status --porcelain -- requirements.txt requirements-dev.txt)" ]; then
            echo "::error::requirements.txt / requirements-dev.txt are out of sync with uv.lock. Regenerate them (see docs/deployment.md > Dependency management) and commit."
            git --no-pager diff -- requirements.txt requirements-dev.txt || true
            exit 1
          fi

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, deps-sync]
    steps:
      - uses: actions/checkout@v6

      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.58.0

      - name: Deploy to Railway
        run: railway up --service request-o-matic
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      - name: Smoke test
        run: |
          curl -sf https://request-o-matic-staging.up.railway.app/health/ready | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          services = data['services']
          errors = []
          if services['groq'] != 'ok':
              errors.append(f\"groq: {services['groq']}\")
          if services['lookup'] not in ('ok', 'unavailable'):
              errors.append(f\"lookup: {services['lookup']}\")
          if services['slack'] not in ('ok', 'unavailable'):
              errors.append(f\"slack: {services['slack']}\")
          if errors:
              print('Smoke test FAILED:', ', '.join(errors))
              sys.exit(1)
          print('Smoke test passed:', json.dumps(services))
          "

  marker-sync:
    # Verifies the pytest marker scheme stays in sync with this file. See
    # plans/test-patterns.md Section 3 ("Sync-check") for the invariant.
    uses: WXYC/wxyc-etl/.github/workflows/check-ci-marker-sync.yml@gha/v1
    with:
      repo-path: "."
      workflows-dir: ".github/workflows"
      tests-dir: "tests"

  notify-failure:
    # Posts to Slack when any gating job fails on a `main` push, so a red CI
    # run gets noticed in minutes instead of weeks (issue #123). Mirrors the
    # `if: failure()` + raw-curl + skip-if-secret-unset pattern from
    # discogs-etl/.github/workflows/rebuild-cache.yml. Scoped to `main` to
    # match the issue; prod-deploy failures aren't covered yet.
    name: Notify on CI failure
    needs: [lint, typecheck, test, marker-sync, deps-sync, deploy-staging]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Post failure to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MONITORING_WEBHOOK }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_URL: "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_MONITORING_WEBHOOK unset; skipping Slack post."
            exit 0
          fi
          SHORT_SHA="${COMMIT_SHA:0:7}"
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\":x: *request-o-matic CI failed on \`main\`*\nCommit: <$COMMIT_URL|$SHORT_SHA> by $ACTOR\nRun: $RUN_URL\"}" \
            || true

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    needs: [lint, typecheck, test, deps-sync]
    steps:
      - uses: actions/checkout@v6

      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.58.0

      - name: Deploy to Railway
        run: railway up --service request-o-matic
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}

      - name: Smoke test
        run: |
          curl -sf https://request-o-matic-production.up.railway.app/health/ready | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          services = data['services']
          errors = []
          if services['groq'] != 'ok':
              errors.append(f\"groq: {services['groq']}\")
          if services['lookup'] not in ('ok', 'unavailable'):
              errors.append(f\"lookup: {services['lookup']}\")
          if services['slack'] not in ('ok', 'unavailable'):
              errors.append(f\"slack: {services['slack']}\")
          if errors:
              print('Smoke test FAILED:', ', '.join(errors))
              sys.exit(1)
          print('Smoke test passed:', json.dumps(services))
          "
