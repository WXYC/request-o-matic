repos:
  # Keep these hook revs aligned with uv.lock (ruff==0.15.1, mypy==1.19.1) so the
  # hooks run the same tool versions as CI. (The mypy hook resolves only the
  # additional_dependencies below in an isolated env, so its import view isn't
  # identical to CI's mypy.) See docs/deployment.md > Dependency management.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic
          - pydantic-settings
          - types-requests
