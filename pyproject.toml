[project]
name = "request-o-matic"
version = "1.0.0"
license = "PolyForm-Noncommercial-1.0.0"
description = "Song request parser with metadata enrichment and Slack integration"
requires-python = ">=3.12"
readme = "README.md"
authors = [
    {name = "Request-O-Matic Team"}
]

dependencies = [
    "fastapi>=0.104.0,<0.138",
    "uvicorn>=0.24.0",
    "groq>=0.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "wxyc-fastapi[posthog]>=1.4.0,<2.0.0",
]

[project.scripts]
lookup = "scripts.lookup:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.22.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    # ruff is pinned (not >=) because scripts/generate_api_models.sh runs `ruff format` and `ruff check --fix` over the generated file, so a different local ruff would reformat generated/api_models.py and read as drift. 0.15.1 is what uv.lock already resolves; keep it in step with .pre-commit-config.yaml's ruff-pre-commit `rev`, which carries the same literal. library-metadata-lookup pins 0.15.6 -- the two repos are not aligned on ruff and don't need to be. See WXYC/library-metadata-lookup#249 for the underlying rationale.
    "ruff==0.15.1",
    "mypy>=1.0.0",
    # datamodel-code-generator is pinned (not >=) so a new upstream release can't silently reformat generated/api_models.py on an unrelated PR -- bumps should be deliberate, reviewable PRs. WXYC/library-metadata-lookup#249 documents the failure mode this prevents: there, 0.55.0 emitted `Field([], validate_default=True)` where 0.56.1 emitted `Field(default_factory=list)`, and Codegen Freshness failed on a PR that had nothing to do with either.
    # 0.57.0 is the version generated/api_models.py was last regenerated with. library-metadata-lookup pins 0.56.1; that divergence is incidental rather than a designed split -- each repo pins whatever it last regenerated with. Nothing currently blocks aligning them: as of 2026-08-04, generator 0.56.1 / 0.57.0 / 0.72.0 each produce a byte-identical file from this spec. Regenerate and diff before changing this value rather than assuming either way.
    "datamodel-code-generator[http]==0.57.0",
]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*", "core*", "config*", "routers*", "services*", "generated*"]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # imported but unused
"generated/*" = ["N815"]  # mixed-case fields from openapi spec

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true once all code is typed
ignore_missing_imports = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
plugins = ["pydantic.mypy"]
exclude = []

[[tool.mypy.overrides]]
module = "generated.*"
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Pytest marker scheme follows the canonical vocabulary defined in
# wiki/plans/test-patterns.md Section 3 ("architecture A"). The canonical
# operational markers are: pg, mysql, external_api, stack, slow.
#
# This repo has no PostgreSQL or MySQL service of its own (search and any
# Discogs/library cache live in library-metadata-lookup), so the only infra
# marker we need is `external_api` (real Groq, real Slack). `slow` is the
# orthogonal cost dimension. `contract` is preserved as a per-repo addition
# that the spec explicitly allows (Section 3, "What is NOT in the marker
# namespace"): contract tests verify the *shape* of an external API contract.
#
# `contract` no longer carries a ci-sync-skip opt-out. It used to be manual-only,
# but the Groq model-liveness check in nlp-nightly.yml now runs
# `-m "external_api and contract"` every night, so the marker is genuinely
# reachable from CI and should be held to that.
#
# ci-sync-skip: slow reason: slow tests build a real venv (install-lookup.sh e2e) or hit staging/production perf endpoints; both are run manually, never in the fast CI lane
[tool.pytest.ini_options]
markers = [
    "external_api: needs network egress + a real third-party API key (Groq, Slack)",
    "slow: takes longer than ~10s (orthogonal to infra)",
    "contract: per-repo marker; verifies external API contract shape (Slack, Groq) — manual only",
]
addopts = "-m 'not external_api and not slow and not contract'"
console_output_style = "progress"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
