[project]
name = "request-o-matic"
version = "1.0.0"
description = "Song request parser with metadata enrichment and Slack integration"
requires-python = ">=3.12"
readme = "README.md"
authors = [
    {name = "Request-O-Matic Team"}
]

dependencies = [
    "fastapi>=0.104.0,<0.138",
    "uvicorn>=0.24.0",
    "groq>=0.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "wxyc-fastapi[posthog]>=1.1.0,<2.0.0",
]

[project.scripts]
lookup = "scripts.lookup:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.22.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "datamodel-code-generator[http]>=0.26.0",
]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*", "core*", "config*", "routers*", "services*", "generated*"]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # imported but unused
"generated/*" = ["N815"]  # mixed-case fields from openapi spec

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true once all code is typed
ignore_missing_imports = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
plugins = ["pydantic.mypy"]
exclude = []

[[tool.mypy.overrides]]
module = "generated.*"
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Pytest marker scheme follows the canonical vocabulary defined in
# wiki/plans/test-patterns.md Section 3 ("architecture A"). The canonical
# operational markers are: pg, mysql, external_api, stack, slow.
#
# This repo has no PostgreSQL or MySQL service of its own (search and any
# Discogs/library cache live in library-metadata-lookup), so the only infra
# marker we need is `external_api` (real Groq, real Slack). `slow` is the
# orthogonal cost dimension. `contract` is preserved as a per-repo addition
# that the spec explicitly allows (Section 3, "What is NOT in the marker
# namespace"): contract tests verify the *shape* of an external API contract
# and are run manually against staging/production.
#
# ci-sync-skip: contract reason: manual-only; verifies external Slack/Groq API contract shape against deployed staging/production
# ci-sync-skip: slow reason: slow tests build a real venv (install-lookup.sh e2e) or hit staging/production perf endpoints; both are run manually, never in the fast CI lane
[tool.pytest.ini_options]
markers = [
    "external_api: needs network egress + a real third-party API key (Groq, Slack)",
    "slow: takes longer than ~10s (orthogonal to infra)",
    "contract: per-repo marker; verifies external API contract shape (Slack, Groq) — manual only",
]
addopts = "-m 'not external_api and not slow and not contract'"
console_output_style = "progress"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
