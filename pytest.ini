[pytest]
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    contract: marks tests as contract parity tests (deselect with '-m "not contract"')

# By default, skip integration and contract tests
addopts = -m "not integration and not contract"

# Test output options
console_output_style = progress
